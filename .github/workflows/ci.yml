name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # IR schema tripwires: lint + wire-compatibility. Breaking compares
  # against HEAD~1 — the previous commit on push, the base branch on PRs
  # (merge commit's first parent). Guards: skips when the compared commit
  # predates spec/proto, or when a commit in range declares [ir-breaking]
  # — the v0 escape hatch: breaking the dev-phase IR is allowed, but only
  # consciously, on the record. Delete the hatch at the v1 freeze (doctrine
  # and the same obligation: spec/proto/buf.yaml).
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.71.0
      - name: Lint the IR schema
        run: buf lint spec/proto
      - name: Breaking-change check
        run: |
          if git log --format=%B HEAD~1..HEAD | grep -q '\[ir-breaking\]'; then
            echo "commit declares [ir-breaking]; skipping breaking check"
          elif git cat-file -e HEAD~1:spec/proto/buf.yaml 2>/dev/null; then
            buf breaking spec/proto --against '.git#ref=HEAD~1,subdir=spec/proto'
          else
            echo "no schema module at HEAD~1; skipping breaking check"
          fi

  # The book {{#include}}s real source files, so a refactor anywhere can break
  # it — but pages.yml is path-filtered (spec/**, examples/**, docs/** don't
  # trigger it). This cheap job closes that seam: every push builds the book.
  # (npm test stays pages-only on purpose: its inputs — web/, sw/python wheels
  # — are all in the pages path filter, and duplicating the wheel build here
  # would double the cost for nothing.)
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the book (pinned mdBook via book/build.sh)
        run: book/build.sh

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI checks
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/dev
          push: never
          runCmd: |
            cmake -S spec/sail -B spec/sail/build
            cmake --build spec/sail/build --target check
            cmake --build spec/sail/build
            ctest --test-dir spec/sail/build --output-on-failure
            (cd sw/python && uv sync --quiet \
              && NANUK_COSIM=1 uv run pytest tests ../../web/py/tests -q \
              && uv run ruff check ../..)
            (cd hw/amaranth && uv sync --quiet \
              && NANUK_COSIM=1 uv run pytest tests -q)
